plugins {
    id 'com.android.application'
}

tasks.register('syncNativeAssets') {
    def assetsDir = file("${projectDir}/src/main/assets")

    outputs.dir(assetsDir)

    doLast {
        assetsDir.mkdirs()

        copy {
            from("${rootProject.projectDir}/shaders")
            include '1.model_loading_es.vs', '1.model_loading_es.fs'
            into assetsDir
        }

        copy {
            from("${rootProject.projectDir}/resources/objects/backpack")
            into "${assetsDir}/backpack"
        }

        def fyScene = file("${rootProject.projectDir}/resources/objects/fy/scene.json")
        if (fyScene.exists()) {
            copy {
                from("${rootProject.projectDir}/resources/objects/fy")
                into "${assetsDir}/fy"
            }
        }

        def configFile = file("${assetsDir}/config.json")
        if (!configFile.exists()) {
            configFile.text = '{\n  "model": "backpack/backpack.obj"\n}\n'
        }
    }
}

android {
    namespace 'com.loadmodel'
    compileSdk 34

    defaultConfig {
        applicationId 'com.loadmodel'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -frtti -fexceptions'
                arguments '-DANDROID_STL=c++_shared'
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

preBuild.dependsOn syncNativeAssets

dependencies {
}
